<style>
:root{
  --fond:#E6F0EC; --carte:#FFFFFF; --texte:#1E2A38; --doux:#5F6B78; --trait:#DCE3E0;
  --encre:#1F3A5F; --soleil:#F4B63F; --aube:#FFE3B8;

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --fond:#10161F; --carte:#1E2836; --texte:#F2F5F8; --doux:#B4BFCC; --trait:#334155;
    --encre:#8FB4E3; --soleil:#F4C25F; --aube:#2A2418; color-scheme: dark; }
}
:root[data-theme="dark"]{ --fond:#10161F; --carte:#1E2836; --texte:#F2F5F8; --doux:#B4BFCC; --trait:#334155;
  --encre:#8FB4E3; --soleil:#F4C25F; --aube:#2A2418; color-scheme: dark; }
:root[data-ambiance="lavande"]{--aube:#E7DCFA;--fond:#EFECF7;--encre:#4B3B8F;--soleil:#F3C27A;--carte:#FFFFFF;--texte:#1E2A38;--doux:#5F6B78;--trait:#DCE3E0;color-scheme:light}
:root[data-ambiance="ocean"]{--aube:#C9E8F5;--fond:#E6F1F4;--encre:#155E75;--soleil:#F2C14E;--carte:#FFFFFF;--texte:#1E2A38;--doux:#5F6B78;--trait:#DCE3E0;color-scheme:light}
:root[data-ambiance="jardin"]{--aube:#DDEFC9;--fond:#EEF4E6;--encre:#2F5D3A;--soleil:#F0B94A;--carte:#FFFFFF;--texte:#1E2A38;--doux:#5F6B78;--trait:#DCE3E0;color-scheme:light}
:root[data-ambiance="nuit"]{--fond:#10161F;--carte:#1E2836;--texte:#F2F5F8;--doux:#B4BFCC;--trait:#334155;--encre:#8FB4E3;--soleil:#F4C25F;--aube:#22304A;color-scheme:dark}
:root[data-ambiance="nuit"] button:not(.leger):not(.lien):not(.themes button),:root[data-ambiance="nuit"] .seg button.on{color:#0E1520}
@media (prefers-color-scheme: dark){ :root[data-ambiance="aube"] button:not(.leger):not(.lien):not(.themes button),:root[data-ambiance="aube"] .seg button.on{color:#0E1520} }
.themes{display:flex;gap:10px;margin-top:10px}
.themes button{width:40px;height:40px;border-radius:50%;padding:0;border:3px solid var(--carte);box-shadow:0 0 0 1px var(--trait)}
.themes button.on{box-shadow:0 0 0 3px var(--encre)}
.outils{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,var(--aube) 0,var(--fond) 340px) no-repeat,var(--fond);min-height:100vh;color:var(--texte);
  font:17px/1.4 ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Nunito","Helvetica Neue",sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
a{color:var(--encre)}
header{padding:20px 18px 6px}
h1{font-size:30px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:15px;margin:26px 18px 8px;color:var(--doux);font-weight:600}
main{padding:0 12px}
.c{background:var(--carte);border-radius:18px;padding:16px;margin:10px 0}
.t{font-weight:650;font-size:18px} .s{color:var(--doux);font-size:15px;margin-top:2px}
.retard{color:var(--impaye);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
button,select,input,textarea{font:inherit;color:inherit}
button{border:0;border-radius:12px;padding:11px 16px;background:var(--encre);color:#fff;font-weight:600;cursor:pointer}
button.leger{background:transparent;color:var(--encre);border:1.5px solid var(--trait)}
button.lien{background:none;color:var(--doux);padding:6px 0;font-weight:500;font-size:15px}
button.gros{width:100%;padding:18px;font-size:19px;border-radius:16px}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--soleil);outline-offset:2px}
select,input,textarea{background:var(--carte);border:1.5px solid var(--trait);border-radius:12px;padding:11px;width:100%}
textarea{min-height:70px;resize:vertical}
label{display:block;margin:12px 0 4px;font-size:15px;color:var(--doux)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--carte);border-top:1px solid var(--trait);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;color:var(--doux);border-radius:0;padding:10px 2px 12px;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px;filter:grayscale(1);opacity:.6}
nav button.on{color:var(--encre)} nav button.on span{filter:none;opacity:1}
#toast{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--texte);color:var(--fond);
  padding:14px 16px;border-radius:16px;display:none;z-index:9;font-weight:600}
.vide{color:var(--doux);padding:16px 6px}
details.c>summary,details.grp>summary{list-style:none;cursor:pointer;color:inherit;font-weight:inherit;padding:0}
details.c>summary::-webkit-details-marker,details.grp>summary::-webkit-details-marker{display:none}
.fl{float:right;color:var(--doux);transition:transform .2s} details[open]>summary .fl{transform:rotate(90deg)}
.alerte{background:var(--impaye);color:#fff;border-radius:18px;padding:16px;margin:10px 0;font-weight:650}
.alerte .s{color:#FFE9E9;font-weight:500} .alerte button{background:#fff;color:var(--impaye)}
.attente{display:inline-block;font-size:14px;font-weight:700;color:var(--partiel);background:color-mix(in srgb,var(--partiel) 16%,transparent);padding:4px 10px;border-radius:20px}
.compte{cursor:pointer} .gros-chiffre{font-size:26px;font-weight:700}
.seg{display:flex;background:var(--carte);border-radius:14px;padding:4px;margin:6px 0 10px}
.seg button{flex:1;background:none;color:var(--doux);padding:9px;border-radius:10px}
.seg button.on{background:var(--encre);color:#fff}
.cherche{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--fond);padding:6px 0 8px}
.puces{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
.puces button{flex:none;padding:6px 12px;font-size:14px}
details.loc{background:var(--carte);border-radius:14px;margin:6px 0}
details.loc>summary{list-style:none;cursor:pointer;color:inherit;font-weight:inherit;padding:12px 14px;display:flex;gap:10px;align-items:center}
details.loc>summary::-webkit-details-marker{display:none}
.loc .nm{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc .bi{color:var(--doux);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dpe{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.fiche{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;padding:0 14px 14px;font-size:15px}
.loc .notes{margin:0 14px;padding-bottom:10px}
.frise{display:flex;gap:3px;padding:0 14px 12px}
.frise span{flex:1;text-align:center;font-size:11px;color:var(--doux)}
.frise i{display:block;height:18px;border-radius:5px;margin-bottom:3px}
.frise .vert i{background:var(--paye)} .frise .orange i{background:var(--partiel)} .frise .rouge i{background:var(--impaye)} .frise .gris i{background:var(--avenir)}
.avert{margin:0 14px 12px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--impaye) 14%,transparent);font-size:15px}
.ech{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--trait)}
.ech:first-of-type{border-top:0} .ech .i{font-size:22px;flex:none}
.ech .j{flex:none;font-size:13px;font-weight:700;color:var(--doux);text-align:right;min-width:52px}
.fiche dt{color:var(--doux)}
:root[data-ambiance="nuit"] .note{background:#273344}
:root[data-ambiance="nuit"] .attente{color:#F5B54A}
@media (prefers-color-scheme: dark){ :root[data-ambiance="aube"] .note{background:#273344} :root[data-ambiance="aube"] .attente{color:#F5B54A} }
.titre-mois{font:inherit;font-size:30px;font-weight:700;letter-spacing:-.01em;border:0;background:transparent;padding:0 28px 0 0;width:auto;color:var(--texte);
  appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--doux) 50%),linear-gradient(135deg,var(--doux) 50%,transparent 50%);
  background-position:calc(100% - 12px) 55%,calc(100% - 6px) 55%;background-size:6px 6px;background-repeat:no-repeat} .fiche dd{margin:0;font-weight:600}
.titre-sci{margin:16px 6px 4px;font-weight:700;color:var(--doux);font-size:15px}
.photo{position:relative;overflow:hidden} .photo input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
/* accueil */
.bonjour{display:flex;align-items:center;gap:14px}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px}
.av.p{width:28px;height:28px;font-size:13px}
.soleil{background:var(--soleil);color:#3A2A00;border-radius:22px;padding:18px;margin:14px 0 4px;font-weight:650;font-size:18px}
.soleil .s{color:#5A4510;font-weight:500}
.soleil.ok{background:var(--paye);color:#fff} .soleil.ok .s{color:#E2F6EA}
.soleil.retard{background:var(--impaye);color:#fff} .soleil.retard .s{color:#FFE9E9}
.fil{display:flex;gap:10px;align-items:center;padding:8px 2px}
.changer{margin-top:10px;display:flex;gap:8px;align-items:center;color:var(--doux);font-size:15px}
.changer select{width:auto;padding:6px 10px}
/* statuts de paiement : couleur + mot + symbole */
.st{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;padding:4px 10px;border-radius:20px;color:#fff}
.st.vert{background:var(--paye)} .st.orange{background:var(--partiel)} .st.rouge{background:var(--impaye)} .st.gris{background:var(--avenir)}
.c.vert{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--paye) 35%,transparent)}
.c.orange{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--partiel) 45%,transparent)}
.c.rouge{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--impaye) 45%,transparent)}
.legende{display:flex;gap:6px;flex-wrap:wrap;margin:10px 4px}
.groupe{display:flex;justify-content:space-between;align-items:baseline;margin:26px 6px 4px}
.groupe b{font-size:19px} .groupe span{color:var(--doux);font-size:14px}
.montant{font-size:15px;margin-top:8px}
.envoye{font-size:14px;color:var(--paye);font-weight:600}
/* dossiers et étapes */
.etapes{margin:12px 0 0;padding:0;list-style:none}
.etapes li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--trait)}
.etapes li .rond{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--trait);display:grid;place-items:center;font-size:13px;margin-top:2px}
.etapes li.fait{color:var(--doux)} .etapes li.fait .rond{background:var(--paye);border-color:var(--paye);color:#fff}
.etapes li.fait .nom{text-decoration:line-through}
.etapes li.avenir{opacity:.55}
.etapes li.actuelle .rond{border-color:var(--soleil);background:color-mix(in srgb,var(--soleil) 30%,transparent)}
.barre{height:6px;border-radius:6px;background:var(--trait);margin-top:10px;overflow:hidden}
.barre i{display:block;height:100%;background:var(--paye);border-radius:6px}
.notes{margin-top:10px;border-top:1px dashed var(--trait);padding-top:8px}
.note{background:var(--fond);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:15px}
.note .s{font-size:13px}
details summary{cursor:pointer;color:var(--encre);font-weight:600;list-style:none;padding:6px 0}
details summary::-webkit-details-marker{display:none}
@media (prefers-reduced-motion: no-preference){ .fini{animation:fini .5s ease forwards} @keyframes fini{to{opacity:0;transform:scale(.97)}} }
</style>

<body>
<header id="haut"></header>
<main id="vue"><p class="vide">Chargement…</p></main>
<nav id="nav" hidden></nav>
<div id="toast" role="status"></div>

<script>
// Adresse de l'API Apps Script (Déployer → Gérer les déploiements → URL de l'application Web).
const API_URL = 'https:\/\/script.google.com/macros/s/AKfycbw0cP8mULwMzQ-rpF3x1YNmGo_B4KSbilAxNZDfin0AOZ1YC8W2rM_b6nD936eBOLYI/exec';
// Lien personnel : ?t=jeton dans l'adresse, gardé aussi sur le téléphone au cas où l'icône s'ouvre sans lui.
const TOKEN = (() => { const u = new URLSearchParams(location.search).get('t'), ok = /^[A-Za-z0-9-]{8,64}$/;
  try { if (u && ok.test(u)) localStorage.setItem('jeton', u); const g = u || localStorage.getItem('jeton'); return ok.test(g || '') ? g : ''; }
  catch (e) { return u && ok.test(u) ? u : ''; } })();
const MOIS_C = ['J','F','M','A','M','J','J','A','S','O','N','D'];
// Droits réglables par Steve : qui a quel menu ou quelle action
const DROITS = [
  ['mois', 'Voir « Le mois »', 'Paiements et envois du mois'],
  ['dossiers', 'Voir « Dossiers » et les fiches locataires', 'Dossiers en cours, loyers, DPE, contacts'],
  ['envoi', 'Marquer les envois aux locataires', 'Quittances, reçus et relances'],
  ['controle', 'Être prévenu si les envois sont en retard', 'Bandeau rouge et rappel WhatsApp à partir du 8'],
  ['photos', 'Envoyer des photos depuis une tâche', 'L’appareil photo s’ouvre directement'],
  ['conseils', 'Lire les conseils de Claude', 'Analyse et propositions à chaque cycle'],
  ['simple', 'Écran simplifié', 'Gros boutons, seulement ses tâches']
];
const THEMES = [['aube','Aube','linear-gradient(135deg,#FFE3B8,#E6F0EC)'],['lavande','Lavande','linear-gradient(135deg,#E7DCFA,#EFECF7)'],
  ['ocean','Océan','linear-gradient(135deg,#C9E8F5,#E6F1F4)'],['jardin','Jardin','linear-gradient(135deg,#DDEFC9,#EEF4E6)'],['nuit','Nuit','linear-gradient(135deg,#22304A,#121821)']];
function theme(t){ document.documentElement.dataset.ambiance = t; try { localStorage.setItem('ambiance', t); } catch(e) {} }
try { theme(localStorage.getItem('ambiance') || 'aube'); } catch(e) {}
let S = { as: null, onglet: 'mes', voirTermines: false, ouverts: {}, ouv: {}, photos: {} };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const js = s => esc(JSON.stringify(String(s)));
const eur = n => (+n || 0).toLocaleString('fr-FR', {style:'currency', currency:'EUR'});
const date = s => s ? s.split('-').reverse().join('/') : 'sans date';
const ymdLocal = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const auj = () => ymdLocal(new Date());
const COULEURS = { Steve:'#1F3A5F', Maman:'#C2577A', Papa:'#3E8E7E', Laetitia:'#E07A3F', Vinciane:'#7A5CC2', Camille:'#2E86C1', Claude:'#8C9AAB' };
const av = (p, petit) => `<span class="av ${petit?'p':''}" style="background:${COULEURS[p]||'#8C9AAB'}" aria-hidden="true">${esc((p||'?').charAt(0))}</span>`;
function toast(m){ const t=$('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',3200); }
// Plus jamais de « Chargement… » sans fin : au bout de 30 s ou en cas d'erreur, le message s'affiche à l'écran.
function bloque(m){ if (!/Chargement/.test($('vue').textContent)) return toast(m);
  $('vue').innerHTML = `<div class="c"><p class="t">Ça ne charge pas</p><p>${esc(m)}</p><p class="s">Fais une capture d’écran et envoie-la à Steve.</p>
    <div class="row"><button onclick="location.reload()">Réessayer</button></div></div>`; }
window.addEventListener('error', e => bloque('Erreur dans la page : ' + e.message));
// Rapidité : tout l'état arrive en un seul appel (« tout ») et reste en mémoire.
// Les onglets lisent cette mémoire sans attendre le serveur ; chaque écriture renvoie l'état à jour.
const LECTURES = { taches: 'taches', leMois: 'mois', conseils: 'conseils', locataires: 'locataires', echeances: 'echeances', globale: 'globale', admin: 'admin' };
function garder(t){
  if (!t || t.state !== 'ok') return false;
  const avant = S.cache ? JSON.stringify(Object.assign({}, S.cache, { le: 0 })) : '';
  S.cache = t; S.cache.le = Date.now();
  if (avant === JSON.stringify(Object.assign({}, t, { le: 0 }))) return false; // rien de neuf
  try { localStorage.setItem('etat:' + TOKEN, JSON.stringify(t)); } catch (e) {}
  return true;
}
// Ne jamais redessiner l'écran sous le doigt : seulement si rien n'a changé depuis 3 s
// (aucun toucher, aucune saisie, aucun volet ouvert). Sinon les nouvelles données s'affichent à la prochaine navigation.
let dernierToucher = 0;
['pointerdown', 'touchstart', 'scroll', 'keydown'].forEach(ev => addEventListener(ev, () => { dernierToucher = Date.now(); }, { passive: true, capture: true }));
const auRepos = () => Date.now() - dernierToucher > 3000 && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))
  && !document.querySelector('#vue details[open]');
async function run(f, ...a){
  const k = LECTURES[f], c = S.cache;
  if (k && c && (c.as || null) === (S.as || null) && c[k] != null && !(f === 'leMois' && a[2] && a[2] !== c.mois.mk)) return c[k];
  const ecrit = !k && !['tout', 'init', 'demanderAcces'].includes(f);
  const r = await appel({ f, args: a, tout: ecrit ? [TOKEN, S.as || null] : undefined });
  if (r.tout) garder(r.tout);
  return r.ok;
}
// Rafraîchit en arrière-plan (onglet ouvert depuis plus d'une minute, retour dans l'app) sans gêner la saisie.
let enCours = null;
function rafraichir(force){
  if (enCours || !S.cache || (!force && Date.now() - S.cache.le < 60000)) return;
  const as = S.as || null;
  enCours = appel({ f: 'tout', args: [TOKEN, as] }, true).then(r => {
    if ((S.as || null) !== as || !r.ok || r.ok.state !== 'ok') return;
    if (garder(r.ok) && auRepos()) { S.droits = r.ok.droits; menu(); afficher(); }
  }).catch(() => {}).finally(() => { enCours = null; });
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) rafraichir(true); });
// text/plain : pas de contrôle CORS préalable, Apps Script accepte la demande telle quelle.
async function appel(q, discret){
  const stop = new AbortController(), h = setTimeout(() => stop.abort(), 30000), f = q.f;
  let r;
  try {
    const rep = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(q), signal: stop.signal, redirect: 'follow' });
    r = await rep.json();
  } catch (e) {
    const m = e.name === 'AbortError' ? 'Le serveur ne répond pas (' + f + '). Vérifie la connexion, puis réessaie.' : 'Impossible de joindre le serveur. Vérifie la connexion.';
    if (!discret) bloque(m); throw e;
  } finally { clearTimeout(h); }
  if (r.err) { const m = String(r.err).replace(/^(Error|Exception|Erreur)\s*:\s*/i, ''); if (!discret) bloque(m); throw new Error(m); }
  return r;
}
const profil = () => S.as || S.moi;
const peut = (cle, p) => ((S.droits || {})[cle] || []).includes(p || profil());

// Liens des remarques (ex. Leboncoin, LocService) en boutons
const SITES = { 'leboncoin.fr':'Leboncoin', 'locservice.fr':'LocService' };
function remarque(r){
  if (!r) return '';
  const liens = [];
  const texte = String(r).replace(/https?:\/\/\S+/g, u => { liens.push(u); return ''; }).trim();
  return (texte ? `<div class="s">${esc(texte)}</div>` : '')
    + (liens.length ? `<div class="row">${liens.map(u => { const h = u.replace(/^https?:\/\/(www\.)?/, '').split('/')[0];
        return `<a href="${esc(u)}" target="_blank" rel="noopener"><button class="leger" tabindex="-1">Ouvrir ${esc(SITES[h] || h)}</button></a>`; }).join('')}</div>` : '');
}

// ---------- Accès ----------
async function demarrer(){
  // Lancement : on affiche tout de suite le dernier état gardé sur le téléphone, puis la version à jour.
  let deja = false;
  try { const snap = JSON.parse(localStorage.getItem('etat:' + TOKEN) || 'null');
    if (snap && snap.state === 'ok' && !snap.as) { S.cache = snap; S.cache.le = 0; ouvrir(snap); deja = true; } } catch (e) {}
  let r;
  try { r = await run('tout', TOKEN, null); } catch (e) { if (deja) toast('Pas de connexion : données du dernier lancement.'); return; }

}

const num = t => { const m = /^(\d+)\.\s/.exec(t.tache); return m ? +m[1] : null; };
const nom = t => t.tache.replace(/^\d+\.\s*/, '');
function etat(t, D){
  if (t.statut === 'Fait') return 'fait';
  const n = num(t); if (n == null) return 'actuelle';
  const min = Math.min(...D.taches.filter(x => x.dossier === t.dossier && x.statut !== 'Fait' && num(x) != null).map(num));
  return n === min ? 'actuelle' : 'avenir';
}
const tri = l => l.sort((a,b) => (a.ech || '9') < (b.ech || '9') ? -1 : 1);

function actions(t, D){
  const p = D.profil;
  if (!t.resp) return peut('simple', p) ? '' : `<button onclick="maj('${t.id}','Responsable',${js(p)})">Je m’en occupe</button>`;
  if (t.resp !== p && t.resp !== 'Tous' && !D.isSteve) return '';
  if (t.statut === 'Fait') return `<button class="lien" onclick="maj('${t.id}','Statut','À faire')">Rouvrir</button>`;
  if (/photo/i.test(t.tache) && peut('photos', p)) {
    const n = S.photos[t.id] || 0;
    return `<label class="photo" style="flex:1"><button class="gros" tabindex="-1">📷 ${n ? 'Une autre photo' : 'Prendre la photo'}</button>

      + (n ? `<button class="${peut('simple', p) ? 'gros' : ''}" onclick="fait(this,'${t.id}')">C’est tout, ${n} photo${n > 1 ? 's' : ''} envoyée${n > 1 ? 's' : ''}</button>` : '');

  if (peut('simple', p)) return `<button class="gros" onclick="fait(this,'${t.id}')">C’est fait</button>`;
  return (t.statut === 'À faire' ? `<button class="leger" onclick="maj('${t.id}','Statut','En cours')">Je commence</button>` : '')
    + `<button onclick="fait(this,'${t.id}')">C’est fait</button>`;

function reglage(t, D){

      <label for="n_loc">Locataire (facultatif)</label><select id="n_loc"><option value=""></option>${D.locataires.map(x=>`<option>${esc(x)}</option>`).join('')}</select>
      <div id="libre"><label for="n_tac">Tâche</label><input id="n_tac">
        <label for="n_resp">Qui s’en occupe</label><select id="n_resp"><option value="">Personne pour l’instant</option>${D.profils.concat('Claude', 'Tous').map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>
      <label for="n_ech">Pour quand</label><input id="n_ech" type="date">
      <div class="row"><button onclick="creer()">Créer</button></div></details>`;
}
async function creer(){
  const n = await run('creer', TOKEN, S.as, { modele: $('n_mod').value, dossier: $('n_dos').value.trim(), loc: $('n_loc').value,
    tache: $('n_tac').value.trim(), resp: $('n_resp').value, ech: $('n_ech').value });
  toast(n > 1 ? 'Dossier créé avec ' + n + ' étapes' : 'Tâche créée'); afficher();
}
// Photo réduite sur le téléphone puis envoyée dans le Drive
async function envoiPhoto(input, id){
  const f = input.files[0]; if (!f) return;
  toast('Envoi de la photo…');
  const img = await createImageBitmap(f), k = Math.min(1, 2000 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k;
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  await run('photo', TOKEN, S.as, id, c.toDataURL('image/jpeg', .85).split(',')[1], 'image/jpeg');
  S.photos[id] = (S.photos[id] || 0) + 1; toast('Photo envoyée, merci !'); afficher();
}
async function fiche(id, k, v){ await run('setFiche', TOKEN, id, k, v); toast('Enregistré'); }
async function maj(id, champ, val){ await run('setTache', TOKEN, S.as, id, champ, val); afficher(); }
async function fait(btn, id){
  const c = btn.closest('.c'); if (c && S.onglet === 'mes') c.classList.add('fini');
  await run('setTache', TOKEN, S.as, id, 'Statut', 'Fait');
  toast(['Bravo, c’est fait !','Merci ' + profil() + ' !','Une de moins 👏'][Math.floor(Math.random()*3)]);
  setTimeout(afficher, 350);
}

// ---------- Situation du mois ----------
function situation(M){
  const n = c => M.locs.filter(l => l.couleur === c).length, som = k => M.locs.reduce((a, l) => a + (+l[k] || 0), 0);
  const dette = M.locs.reduce((a, l) => a + (l.dette > 0 ? l.dette : 0), 0);
  const nonEnv = M.locs.filter(l => !l.envoye).length;
  return { payes: n('vert'), partiels: n('orange'), impayes: n('rouge'), avenir: n('gris'), du: som('du'), recu: som('recu'), dette, nonEnv,
    enRetard: M.courant && !M.peutEnvoyer && nonEnv > 0 && new Date().getDate() >= 8 };
}
function alerteEnvois(M, X){
  if (!X.enRetard || !M.controle) return ''; // seulement pour qui contrôle les envois
  const msg = 'Petit rappel 🙂 Il reste ' + X.nonEnv + ' courrier' + (X.nonEnv > 1 ? 's' : '') + ' du mois à envoyer dans l’app Gestion Fam. Merci ' + M.envoyeur + ' !';
  return `<div class="alerte">⚠️ ${X.nonEnv} courrier${X.nonEnv > 1 ? 's' : ''} pas encore envoyé${X.nonEnv > 1 ? 's' : ''} par ${esc(M.envoyeur)}
    <div class="s">Les envois devaient être faits le 7.</div>
    <div class="row"><a href="https:\/\/wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener"><button tabindex="-1">Prévenir sur WhatsApp</button></a></div></div>`;
}

// ---------- Le mois ----------
const STATUT = { vert:'✓ Payé', orange:'½ Partiel', rouge:'! Impayé', gris:'◷ À venir' };
const GROUPES = [['CLS','SCI CLSV'],['CGF','SCI CGF'],['PERSO','Hors SCI, 1 place Alphonse Daudet']];
async function vueMois(){
  const M = await run('leMois', TOKEN, S.as, S.moisSel || null);
  const mois = Array.from({length:12}, (_, i) => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
    return [ymdLocal(d).slice(0, 7), d.toLocaleDateString('fr-FR', { month:'long', year:'numeric' })]; });
  $('haut').innerHTML = `<select class="titre-mois" aria-label="Choisir le mois" onchange="S.moisSel=this.value;vueMois()">${mois.map(([k, t]) => `<option value="${k}" ${k === M.mk ? 'selected' : ''}>${esc(t.charAt(0).toUpperCase() + t.slice(1))}</option>`).join('')}</select>
    <div class="s" style="margin-top:4px">${M.passe ? '📚 Mois passé, d’après l’historique' : '🔄 À jour au relevé bancaire du ' + date(M.releve)}</div>`;
  const nb = c => M.locs.filter(l => l.couleur === c).length, X = situation(M);
  const groupes = GROUPES.concat([...new Set(M.locs.map(l => l.sci))].filter(s => !GROUPES.some(g => g[0] === s)).map(s => [s, s]));
  $('vue').innerHTML = (M.courant || M.passe ? '' : `<div class="c" style="background:var(--soleil);color:#3A2A00">Le tableau est réglé sur un autre mois que le mois en cours. Les couleurs suivent seulement ce mois-là.</div>`)
    + alerteEnvois(M, X)
    + `<div class="c"><div class="s">Reçu ce mois</div><div class="gros-chiffre">${eur(X.recu)} <span class="s">sur ${eur(X.du)}</span></div>
       <div class="barre"><i style="width:${X.du ? Math.round(100 * X.recu / X.du) : 0}%"></i></div>
       <div class="legende" style="margin:12px 0 0">${['vert','orange','rouge','gris'].filter(c => nb(c)).map(c => `<span class="st ${c}">${STATUT[c]} : ${nb(c)}</span>`).join('')}</div>
       ${X.dette > 0.005 ? `<div class="s" style="margin-top:10px">Total dû par les locataires, retards compris : <b>${eur(X.dette)}</b></div>` : ''}
       <div class="s">Envois : ${M.locs.length - X.nonEnv} sur ${M.locs.length}</div></div>`
    + groupes.map(([code, titre]) => {
        const ordre = { rouge:0, orange:1, gris:2, vert:3 };
        const l = M.locs.filter(x => x.sci === code).sort((a, b) => ordre[a.couleur] - ordre[b.couleur]); if (!l.length) return '';
        const env = l.filter(x => x.envoye).length;
        const k = 'sci-' + code, c = col => l.filter(x => x.couleur === col).length;
        return `<details class="grp" ${S.ouv[k] ? 'open' : ''} ontoggle="S.ouv[${js(k)}]=this.open"><summary><div class="c">
            <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline"><b style="font-size:19px;min-width:0">${esc(titre)}</b><span class="fl" style="float:none">›</span></div>
            <div class="row" style="margin-top:8px">${['vert','orange','rouge','gris'].filter(col => c(col)).map(col => `<span class="st ${col}">${STATUT[col]} : ${c(col)}</span>`).join('')}</div>
            <div class="s" style="margin-top:6px">${env} sur ${l.length} envoyé${env > 1 ? 's' : ''}</div></div></summary>`
          + l.map(x => `<div class="c ${x.couleur}">
            <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div class="t">${esc(x.nom)}</div><span class="st ${x.couleur}">${STATUT[x.couleur]}</span></div>
            <div class="s">${esc(x.bien)}</div>
            <div class="montant">Reçu <b>${eur(x.recu)}</b> sur ${eur(x.du)}${x.dette > 0.005 ? `<br>Reste dû au total : <b>${eur(x.dette)}</b>` : ''}</div>
            <div class="s">À faire : ${esc(x.action).toLowerCase()}</div>
            <div class="row">${x.envoye ? `<span class="envoye">✓ Envoyé par ${esc(String(x.envoye.qui).split(' ')[0])} le ${date(x.envoye.le)}</span>`
              : M.passe ? '' : M.peutEnvoyer ? `<button onclick="envoye(${js(x.id)},${js(M.mk)})">Marquer comme envoyé</button>` : `<span class="attente">⏳ Pas encore envoyé par ${esc(M.envoyeur)}</span>`}</div>
            ${blocNotes(x.id, M.notes)}</div>`).join('') + `</details>`;
      }).join('');
}
async function envoye(id, mk){ await run('marquer', TOKEN, S.as, id, mk); toast('C’est noté, merci !'); vueMois(); }

// ---------- Réglages (Steve) ----------
async function vueConseils(){
  const C = await run('conseils', TOKEN);
  $('haut').innerHTML = `<button class="lien" onclick="S.onglet='mes';menu();afficher(1)">‹ Accueil</button><h1>Conseils de Claude</h1>`;
  $('vue').innerHTML = C.map((c, i) => `<details class="c" ${i === 0 ? 'open' : ''}><summary><span class="fl">›</span><div class="t">${esc(c.mois)}</div>
      <div class="s">Écrit le ${date(c.le)}, ${c.items.length} point${c.items.length > 1 ? 's' : ''}</div></summary>
      ${c.items.map(x => `<div class="note"><b>${esc(x[0])}</b><div style="margin-top:4px">${esc(x[1])}</div></div>`).join('')}</details>`).join('')
    + `<p class="vide">Claude écrit ces conseils à chaque cycle mensuel. Ils sont en lecture seule : pour en discuter, ajoute une note dans le dossier concerné.</p>`;
}
let vueSteve = async function(){
  const A = await run('admin', TOKEN);
  const G = await run('globale', TOKEN);
  $('haut').innerHTML = `<h1>Pilotage</h1>`;
  const retards = Object.entries(G.retard).sort((a, b) => b[1] - a[1]);
  const globale = `<h2>Vue d’ensemble</h2><div class="c"><div class="s">Encaissé depuis janvier</div>
      ${G.encaisse.map(([s, v]) => `<div class="fil" style="justify-content:space-between"><span>${esc(s)}</span><b>${eur(v)}</b></div>`).join('')}
      <div class="fil" style="justify-content:space-between;border-top:1px solid var(--trait);margin-top:4px;padding-top:10px"><span>Total</span><b>${eur(G.encaisse.reduce((a, x) => a + x[1], 0))}</b></div></div>
    <div class="c"><div class="s">Qui doit encore de l’argent</div>
      ${G.impayes.map(i => `<div class="fil" style="justify-content:space-between"><span>${esc(i.nom)}</span><b style="color:var(--impaye)">${eur(i.dette)}</b></div>`).join('') || `<p class="vide">${G.courant ? 'Personne. Bravo !' : 'Le tableau n’est pas réglé sur le mois en cours (2. Suivi du mois, case C3).'}</p>`}</div>
    <div class="c"><div class="s">Tâches en retard</div>
      ${retards.map(([p, n]) => `<div class="fil" style="justify-content:space-between"><span class="bonjour" style="gap:10px">${av(p === 'Sans responsable' ? '?' : p, 1)}${esc(p)}</span><b>${n}</b></div>`).join('') || '<p class="vide">Aucune tâche en retard.</p>'}
      ${G.retard['Sans responsable'] ? `<div class="row"><button class="leger" onclick="S.onglet='taches';S.sous='dos';menu();afficher(1)">Attribuer les tâches</button></div>` : ''}</div>`;
  const att = A.appareils.filter(a => a.statut === 'En attente'), ok = A.appareils.filter(a => a.statut === 'Autorisé');
  $('vue').innerHTML = globale + `<h2>Demandes d’accès</h2>`
    + (att.map(a => `<div class="c"><div class="bonjour">${av(a.prenom, 1)}<div><div class="t">${esc(a.prenom)} demande l’accès</div><div class="s">le ${date(a.le)}. Vérifie avec elle ou lui avant d’accepter.</div></div></div>
        <div class="row"><button onclick="acces(${a.row},'Autorisé')">Autoriser</button><button class="leger" onclick="acces(${a.row},'Refusé')">Refuser</button></div></div>`).join('')
      || '<p class="vide">Aucune demande.</p>')
    + `<h2>Téléphones autorisés</h2><div class="c">`
    + ok.map(a => `<div class="fil" style="justify-content:space-between"><span class="bonjour" style="gap:10px">${av(a.prenom, 1)}${esc(a.prenom)}</span>
        <button class="lien" onclick="if(confirm('Retirer l’accès de ce téléphone ?'))acces(${a.row},'Révoqué')">Retirer</button></div>`).join('') + `</div>`
    + `<h2>Qui a accès à quoi</h2>`
    + DROITS.map(([cle, titre, aide]) => `<div class="c"><div class="t" style="font-size:16px">${esc(titre)}</div><div class="s">${esc(aide)}</div>
        <div class="row">${S.profils.map(p => { const on = peut(cle, p);
          return `<button class="${on ? '' : 'leger'}" aria-pressed="${on}" style="padding:7px 12px;font-size:15px" onclick="droit('${cle}',${js(p)},${!on})">${on ? '✓ ' : ''}${esc(p)}</button>`; }).join('')}</div></div>`).join('')
    + `<h2>Dernières actions</h2>`
    + A.journal.map(j => `<div class="c"><div class="s">${esc(j.le)}, ${esc(j.qui)}</div>
        <div>${esc(j.action)} ${esc(j.ligne)} ${esc(j.colonne)}${j.avant || j.apres ? ` : ${esc(j.avant)} ➜ ${esc(j.apres)}` : ''}</div>
        <div class="row">${j.annule ? '<span class="s">Annulé</span>' : j.annulable ? `<button class="leger" onclick="annuler(${j.row})">Annuler</button>` : ''}</div></div>`).join('');
}
async function droit(cle, p, oui){ S.droits = await run('droit', TOKEN, cle, p, oui); menu(); afficher(); }
async function acces(row, st){ await run('statutAppareil', TOKEN, row, st); vueSteve(); }
async function annuler(row){ await run('annuler', TOKEN, row); toast('Annulé'); vueSteve(); }

demarrer();
